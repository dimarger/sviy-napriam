];

// Each question gives exactly one point to one interest. Rotate the display order
// so a direction is not always associated with the same answer position.
const questions = rows.map(([title, texts], index) => ({title, options: keys.map((_, position) => {
  const source = (position + index) % keys.length;
  return {type:keys[source], text:texts[source]};
})}));

function scoreAnswers(answers) {
  if (!Array.isArray(answers) || answers.length !== questions.length || answers.filter(answer => keys.includes(answer)).length !== questions.length) {
    throw new Error('Дай відповідь на всі запитання.');
  }
  const scores = Object.fromEntries(keys.map(key=>[key,0]));
  answers.forEach(key=>scores[key]++);
  const ranked = keys.map(key=>({key,score:scores[key]})).sort((a,b)=>b.score-a.score);
  const threshold = ranked[2].score;
  // Keep every direction tied for third place; do not arbitrarily discard a tie.
  return {scores, ranked, top:ranked.filter(item=>item.score >= threshold && item.score > 0), leaders:ranked.filter(item=>item.score === ranked[0].score)};
}

return {profiles,questions,scoreAnswers};
})();

  } else if(hash==='#result') {
    if(!completed()){location.replace('#test');return;}
    results();document.title='Мій результат — Свій напрям';
  } else {
    home();document.title='Свій напрям — професії починаються з цікавості';
    document.querySelector('.hero-start').addEventListener('click',event=>{
      if(completed()){event.preventDefault();navigate('#result');}
      else {const first=state.answers.indexOf(null);if(first>=0) state.index=first;save();}
    });
  }
  if(hash==='#how'||hash==='#directions') {
    const section=document.querySelector(hash);section.setAttribute('tabindex','-1');section.focus({preventScroll:true});section.scrollIntoView();
  } else {window.scrollTo(0,0);focusMain();}
  announce(hash==='#test'?`Запитання ${state.index+1} з 12`:hash==='#result'?'Твій результат готовий':'Головна сторінка');
}
window.addEventListener('hashchange',route);
route();

</script>
</body>
</html>
